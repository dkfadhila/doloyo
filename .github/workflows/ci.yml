name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm test
      # SKIP_MODELS: CI does not need the 9 MB pose model; the app falls back to the CDN at runtime anyway
      - run: npm run build
        env:
          SKIP_MODELS: '1'
      - run: npm ci --prefix mcp
      - run: npm run mcp:build
      - run: npm run smoke --prefix mcp
      - run: npm pack --dry-run --prefix mcp
